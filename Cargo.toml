[package]
name = "wasmer-workspace"
description = "Wasmer workspace"
publish = false
autoexamples = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
wasmer = { version = "=7.4.0", path = "lib/api", default-features = false }
wasmer-cache = { version = "=7.4.0", path = "lib/cache", optional = true }
wasmer-compiler = { version = "=7.4.0", path = "lib/compiler", features = [
  "compiler",
], optional = true }
wasmer-compiler-cranelift = { version = "=7.4.0", path = "lib/compiler-cranelift", optional = true }
wasmer-compiler-llvm = { version = "=7.4.0", path = "lib/compiler-llvm", optional = true }
wasmer-compiler-singlepass = { version = "=7.4.0", path = "lib/compiler-singlepass", optional = true }
wasmer-middlewares = { version = "=7.4.0", path = "lib/middlewares", optional = true }
wasmer-types = { version = "=7.4.0", path = "lib/types" }
wasmer-wast = { version = "=7.4.0", path = "tests/lib/wast", optional = true }
wasmer-wasix = { path = "lib/wasix", optional = true }

# Third party dependencies
crossbeam-queue.workspace = true
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
], optional = true }

[workspace]
members = [
  "fuzz",
  "lib/api",
  "lib/api/macro-wasmer-engine-test",
  "lib/backend-api",
  "lib/c-api",
  "lib/c-api-imports",
  "lib/c-api/examples/wasmer-capi-examples-runner",
  "lib/c-api/tests/wasmer-c-api-test-runner",
  "lib/cache",
  "lib/cli",
  "lib/compiler-cranelift",
  "lib/compiler-llvm",
  "lib/compiler-singlepass",
  "lib/compiler",
  "lib/config",
  "lib/derive",
  "lib/napi",
  "lib/sys-utils",
  "lib/types",
  "lib/sdk",
  "lib/virtual-io",
  "lib/virtual-fs",
  "lib/virtual-net",
  "lib/vm",
  "lib/wai-bindgen-wasmer",
  "lib/wasi-types",
  "lib/wasix",
  "lib/journal",
  "lib/swift",
  "lib/package",
  "tests/integration/cli",
  "tests/integration/ios",
  "tests/lib/compiler-test-derive",
  "tests/lib/wast",
  "tests/wasmer-argus",
]
exclude = ["./lib/cli/tests/packages/axum", "lib/wild"]
resolver = "2"

[workspace.package]
authors = ["Wasmer Engineering Team <engineering@wasmer.io>"]
edition = "2024"
homepage = "https://wasmer.io/"
license = "MIT"
repository = "https://github.com/wasmerio/wasmer"
rust-version = "1.95"
version = "7.4.0"

[workspace.dependencies]
# Repo-local crates
wasmer-package = { version = "0.704.0", path = "lib/package" }
wasmer-config = { path = "./lib/config" }
wasmer-wasix = { path = "./lib/wasix" }
wasmer-sdk = { path = "./lib/sdk" }

